<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>icon-button-aria-label · success</title>
</head>
<body>
  <button type="submit">Отправить</button>
  <button type="button" aria-label="Закрыть">
    <svg aria-hidden="true" width="16" height="16"></svg>
  </button>
  <button type="button" title="Меню">
    <img src="menu.svg" alt="" width="16" height="16">
  </button>
  <button type="button" aria-labelledby="cart-title">
    <svg width="16" height="16"></svg>
  </button>
  <button type="button">
    <span class="visually-hidden">Меню</span>
    <svg width="16" height="16"></svg>
  </button>
</body>
</html>
